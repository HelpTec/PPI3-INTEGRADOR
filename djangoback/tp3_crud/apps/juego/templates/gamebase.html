{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameBase</title>
<link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
<link rel="stylesheet" href="{% static 'css/gb-hifi.css' %}">
<link rel="stylesheet" href="{% static 'css/gb-app.css' %}">
</head>
<body>
<div id="gb-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script>
window.GB_AUTH = {
  authenticated: {{ user.is_authenticated|yesno:"true,false" }},
  username: "{{ user.username|escapejs }}",
  loginUrl: "{% url 'login' %}",
  logoutUrl: "{% url 'logout' %}",
  csrfToken: "{{ csrf_token }}"
};

/* Load JSX modules in order — Babel.transform each file then eval sequentially */
(function loadModules(){
  var modules = [
    "{% static 'js/gb-utils.js' %}",
    "{% static 'js/gb-components.js' %}",
    "{% static 'js/gb-detail.js' %}",
    "{% static 'js/gb-emulator.js' %}",
    "{% static 'js/gb-app.js' %}"
  ];
  function next(i){
    if(i >= modules.length) return;
    fetch(modules[i])
      .then(function(r){ return r.text(); })
      .then(function(src){
        var code = Babel.transform(src, {presets:['react']}).code;
        (new Function(code))();
        next(i + 1);
      })
      .catch(function(e){ console.error('GB module load error:', modules[i], e); });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ next(0); });
  } else {
    next(0);
  }
})();
</script>

<!-- Chat FAB + panel retro -->
<button class="chat-fab" id="chatFab" aria-label="Abrir asistente">
  <span class="dot"></span>
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2.4"/>
    <path d="M7 17l-2 4 6-4" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" fill="currentColor"/>
    <rect x="7" y="9" width="2.4" height="2.4" fill="currentColor"/>
    <rect x="11" y="9" width="2.4" height="2.4" fill="currentColor"/>
    <rect x="15" y="9" width="2.4" height="2.4" fill="currentColor"/>
  </svg>
</button>

<section class="chat-panel" id="chatPanel" aria-hidden="true">
  <div class="chat-head">
    <svg class="ci" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2.4"/>
      <rect x="7" y="9" width="2.4" height="2.4" fill="currentColor"/>
      <rect x="11" y="9" width="2.4" height="2.4" fill="currentColor"/>
      <rect x="15" y="9" width="2.4" height="2.4" fill="currentColor"/>
    </svg>
    <div>
      <div class="ht">CHAT <b>GAMEBASE</b></div>
      <div class="st">Asistente de juegos IA</div>
    </div>
    <button class="chat-x" id="chatClose" aria-label="Cerrar">✕</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <form class="chat-foot" id="chatForm">
    <input id="chatInput" type="text" placeholder="Escribí un mensaje…" autocomplete="off" maxlength="240">
    <button class="chat-send" type="submit">ENVIAR</button>
  </form>
</section>

<script src="{% static 'js/gb-chat.js' %}"></script>
</body>
</html>
