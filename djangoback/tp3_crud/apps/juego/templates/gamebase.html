{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameBase</title>
<link rel="stylesheet" href="{% static 'css/gb-hifi.css' %}">
<style>
  html,body { margin:0; height:100%; overflow:hidden; }
  #gb-root { height:100vh; }
  .app { height:100vh; }

  /* auth chip en topbar */
  .tb-user {
    font-family: var(--pixel-font); font-size: 10px; color: var(--green);
    border: 2px solid var(--line-2); background: var(--surface-2);
    padding: 6px 10px; white-space: nowrap; cursor: default;
  }
  .tb-user a { color: var(--muted); text-decoration: none; font-size: 14px;
    margin-left: 8px; font-family: var(--ui-font); }
  .tb-user a:hover { color: var(--green); }
  .tb-nav { display:flex; gap:6px; flex:0 0 auto; }
  .tb-nav button {
    font-family: var(--pixel-font); font-size: 10px; background: none;
    border: 2px solid var(--line-2); color: var(--muted); padding: 6px 10px;
    cursor: pointer; transition: .12s;
  }
  .tb-nav button:hover { border-color: var(--green-d); color: var(--text); }
  .tb-nav button.active { border-color: var(--green); color: var(--green); background: var(--surface-2); }

  /* cover con imagen real */
  .cover { position: relative; }
  .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .cover .con-tag, .cover .fav, .cover .mono, .cover .play-ov { z-index:2; }
  .cover .mono { z-index:1; opacity:.55; }

  /* CAMBIO 3 — título siempre 2 líneas, meta alineado */
  .card { display:flex; flex-direction:column; }
  .c-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.15; min-height: 2.3em;
    margin: 9px 1px 2px; font-size: 19px; color: var(--text);
  }
  .c-meta { font-size: 15px; color: var(--muted); margin: 0 1px; margin-top: auto; }

  /* CAMBIO 2 — estante sin scroll horizontal */
  .shelf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    grid-template-rows: auto;
    grid-auto-rows: 0px;        /* filas extra colapsan a 0 */
    overflow: hidden;           /* nada de barra horizontal */
    gap: 16px;
    padding: 6px 22px 0;
  }

  /* vista catálogo completo (ver todo) */
  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px; padding: 6px 22px 40px;
  }

  /* sección emulador — 3 tarjetas grandes */
  .emu-library {
    flex: 1; overflow-y: auto; padding: 28px 22px;
  }
  .emu-library h2 {
    font-family: var(--pixel-font); font-size: 14px; color: var(--text);
    margin: 0 0 6px;
  }
  .emu-library p { font-size: 18px; color: var(--muted); margin: 0 0 28px; }
  .emu-cards { display: flex; gap: 22px; flex-wrap: wrap; }
  .emu-card {
    width: 200px; background: var(--surface); border: 3px solid var(--line-2);
    cursor: pointer; transition: .14s; padding: 0; text-align: left;
  }
  .emu-card:hover { border-color: var(--green); transform: translateY(-4px); }
  .emu-card .emu-cover {
    width: 100%; aspect-ratio: 3/4; position: relative;
    border-bottom: 3px solid var(--line-2); overflow: hidden;
    image-rendering: pixelated;
  }
  .emu-card:hover .emu-cover { border-color: var(--green); }
  .emu-card .emu-cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .emu-card .emu-badge {
    position:absolute; inset:0; display:grid; place-items:center; z-index:2;
    background: rgba(10,14,6,.45);
  }
  .emu-card .emu-badge span {
    width:54px; height:54px; background:var(--green); color:var(--ink);
    display:grid; place-items:center; font-size:22px;
    border:3px solid var(--ink); box-shadow:3px 3px 0 var(--green-dd);
  }
  .emu-card .emu-info { padding: 10px 12px 14px; }
  .emu-card .emu-title { font-family: var(--pixel-font); font-size:11px; color:var(--text); line-height:1.4; }
  .emu-card .emu-con { font-size:16px; color:var(--green); margin-top:4px; }

  /* spinner */
  .loading {
    flex:1; display:grid; place-items:center;
    font-family:var(--pixel-font); font-size:13px; color:var(--green); letter-spacing:1px;
  }
  .loading::after {
    content:''; display:block; width:18px; height:18px;
    border:3px solid var(--green-d); border-top-color:var(--green);
    border-radius:50%; animation:spin .7s linear infinite; margin:16px auto 0;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* descripción IGDB en ficha */
  .d-summary {
    font-family: var(--body-font); font-size: 15px; line-height: 1.65;
    color: #cdd2bb; max-width: 62ch; margin: 16px 0 0;
  }

  /* ratings block */
  .ratings { display:flex; gap:14px; flex-wrap:wrap; margin:0 0 22px; }
  .rate {
    display:flex; align-items:center; gap:12px;
    border:2px solid var(--line); background:var(--surface); padding:10px 16px;
  }
  .rate .num { font-family:var(--pixel-font); font-size:22px; color:var(--green); line-height:1; }
  .rate .lab { font-size:15px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1px; line-height:1.2; }
  .rate .lab b { display:block; color:var(--text); font-weight:normal; font-size:16px; }

  /* characters grid */
  .chars { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
  .char  { text-align:center; }
  .mug {
    width:100%; aspect-ratio:1/1; border:2px solid var(--line-2);
    overflow:hidden; position:relative; image-rendering:pixelated; background:var(--surface);
  }
  .char:hover .mug { border-color:var(--green); box-shadow:4px 4px 0 var(--green-dd); }
  .mug img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .mug .mono { position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--pixel-font); font-size:18px; color:rgba(12,18,8,.5); }
  .char .cn { font-size:17px; color:var(--text); margin:8px 1px 1px; line-height:1.05; }

  /* screenshot gallery */
  .gallery { display:grid; grid-template-columns:1.7fr 1fr; gap:12px; }
  .shot-main {
    aspect-ratio:16/9; border:2px solid var(--line-2);
    position:relative; overflow:hidden; image-rendering:pixelated; cursor:pointer;
  }
  .shot-strip { display:grid; grid-template-rows:1fr 1fr; gap:12px; }
  .shot-sm {
    border:2px solid var(--line-2); position:relative;
    overflow:hidden; image-rendering:pixelated; cursor:pointer;
  }
  .shot-sm:hover, .shot-main:hover { border-color:var(--green); }
  .shot-main img, .shot-sm img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .shot-more {
    display:grid; place-items:center; font-family:var(--pixel-font);
    font-size:11px; color:var(--green); background:var(--surface);
    border:2px solid var(--green-d); cursor:pointer;
  }
  .shot-more:hover { background:var(--surface-2); }

  /* lightbox */
  .lightbox {
    position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox img { max-width:100%; max-height:90vh; border:3px solid var(--line-2); }
  .lightbox-close {
    position:absolute; top:18px; right:22px; background:none; border:2px solid var(--line-2);
    color:var(--text); font-family:var(--pixel-font); font-size:11px; padding:6px 12px; cursor:pointer;
  }
  .lightbox-close:hover { border-color:var(--green); color:var(--green); }

  /* video trailer */
  .trailer {
    display:flex; align-items:center; gap:14px;
    border:2px solid var(--line); background:var(--surface); padding:14px 18px;
    cursor:pointer; transition:.12s;
  }
  .trailer:hover { border-color:var(--green); }
  .trailer .pl {
    width:46px; height:46px; flex:0 0 auto; background:var(--green); color:var(--ink);
    display:grid; place-items:center; font-size:20px;
    border:3px solid var(--ink); box-shadow:3px 3px 0 var(--green-dd);
  }
  .trailer .tx { font-size:19px; color:var(--text); }
  .trailer .tx b { display:block; font-size:15px; color:var(--muted); font-weight:normal; }
  .yt-embed { width:100%; aspect-ratio:16/9; border:2px solid var(--line-2); margin-top:12px; }

  /* similar games */
  .sim { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
  .sim .tile { border:2px solid var(--line-2); background:var(--surface); padding:5px; cursor:pointer; }
  .sim .tile:hover { border-color:var(--green); }
  .sim .art {
    width:100%; aspect-ratio:3/4; border:2px solid var(--line);
    position:relative; overflow:hidden; image-rendering:pixelated; background:var(--surface-2);
  }
  .sim .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .sim .art .mono { position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--pixel-font); font-size:14px; color:rgba(12,18,8,.5); }
  .sim .st { font-size:15px; color:var(--text); margin:6px 1px 1px; line-height:1.05; }

  /* age rating + tag chips */
  .taglist { display:flex; gap:8px; flex-wrap:wrap; }
  .taglist .t { font-size:16px; color:var(--text); background:var(--surface);
    border:2px solid var(--line); padding:4px 11px; }
  .age-chip {
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--pixel-font); font-size:10px; color:var(--text);
    border:2px solid var(--line-2); background:var(--surface-2); padding:5px 10px;
  }
  .age-chip .org { color:var(--muted); font-size:9px; }

  /* screenshots reales (fallback en ficha de spec) */
  .shot img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  @media(max-width:860px){
    .chars,.sim { grid-template-columns:repeat(4,1fr); }
    .gallery { grid-template-columns:1fr; }
    .shot-strip { grid-template-rows:none; grid-template-columns:1fr 1fr; }
  }
  @media(max-width:860px){
    .chars,.sim { grid-template-columns:repeat(4,1fr); }
    .gallery { grid-template-columns:1fr; }
    .shot-strip { grid-template-rows:none; grid-template-columns:1fr 1fr; }
  }
  @media(max-width:460px){
    .chars,.sim { grid-template-columns:repeat(3,1fr); }
  }

  /* ── chat FAB + panel retro ── */
  .chat-fab{
    position:fixed;right:24px;bottom:24px;z-index:120;
    width:60px;height:60px;background:var(--green);color:var(--ink);
    border:3px solid var(--ink);box-shadow:5px 5px 0 var(--green-dd);
    display:grid;place-items:center;cursor:pointer;transition:.1s;
  }
  .chat-fab:hover{background:var(--green-2);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--green-dd);}
  .chat-fab:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--green-dd);}
  .chat-fab svg{width:30px;height:30px;}
  .chat-fab .dot{
    position:absolute;top:-5px;right:-5px;width:16px;height:16px;
    background:#e94f8a;border:2px solid var(--ink);
  }
  .chat-panel{
    position:fixed;right:24px;bottom:96px;z-index:121;
    width:330px;height:444px;display:flex;flex-direction:column;
    background:var(--bg-2);border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.4);
    opacity:0;transform:translateY(14px) scale(.98);pointer-events:none;transition:.16s ease;
  }
  .chat-panel.open{opacity:1;transform:none;pointer-events:auto;}
  .chat-head{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:11px 13px;background:var(--ink);border-bottom:3px solid var(--green-d);
  }
  .chat-head .ci{width:26px;height:26px;color:var(--green);}
  .chat-head .ht{font-family:var(--pixel-font);font-size:11px;color:var(--text);line-height:1.4;}
  .chat-head .ht b{color:var(--green);}
  .chat-head .st{font-family:var(--ui-font);font-size:14px;color:var(--muted);}
  .chat-x{margin-left:auto;background:none;border:2px solid var(--line-2);color:var(--muted);
    width:30px;height:30px;cursor:pointer;font-family:var(--ui-font);font-size:18px;}
  .chat-x:hover{border-color:var(--green);color:var(--green);}
  .chat-body{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:10px;}
  .chat-body::-webkit-scrollbar{width:8px;}
  .chat-body::-webkit-scrollbar-track{background:var(--bg);}
  .chat-body::-webkit-scrollbar-thumb{background:var(--line-2);}
  .msg{max-width:82%;font-family:var(--ui-font);font-size:18px;line-height:1.25;
    padding:8px 11px;border:2px solid var(--line);}
  .msg.bot{align-self:flex-start;background:var(--surface);color:var(--text);}
  .msg.me{align-self:flex-end;background:var(--green-d);color:#eaf3c8;border-color:var(--green-d);}
  .msg.typing{align-self:flex-start;background:var(--surface);color:var(--muted);font-style:italic;}
  .chat-foot{flex:0 0 auto;display:flex;gap:8px;padding:10px;border-top:2px solid var(--line);}
  .chat-foot input{
    flex:1;background:var(--surface);border:2px solid var(--line);outline:0;
    color:var(--text);font-family:var(--ui-font);font-size:18px;padding:9px 11px;min-width:0;
  }
  .chat-foot input:focus{border-color:var(--green);}
  .chat-send{
    background:var(--green);color:var(--ink);border:2px solid var(--ink);
    font-family:var(--pixel-font);font-size:10px;padding:0 14px;cursor:pointer;
  }
  .chat-send:hover{background:var(--green-2);}
  @media(max-width:460px){
    .chat-panel{right:12px;left:12px;width:auto;bottom:88px;height:60vh;}
    .chat-fab{right:16px;bottom:16px;}
  }
</style>
</head>

/* ---- paletas para portadas sin imagen ---- */
const PALETTES = [
  {sky:"#4a78c4",ground:"#2f5d34"},{sky:"#2a2150",ground:"#5a3a7a"},
  {sky:"#3a7a4a",ground:"#1d4a2a"},{sky:"#8a4a2a",ground:"#4a2a1a"},
  {sky:"#3a5a8a",ground:"#2a3a6a"},{sky:"#9a2a3a",ground:"#5a1a2a"},
  {sky:"#5aa0c4",ground:"#3a6a4a"},{sky:"#c46a2a",ground:"#6a3a1a"},
  {sky:"#2a2a4a",ground:"#7a2a5a"},{sky:"#2a6a8a",ground:"#1a4a5a"},
];
function palette(id){
  const n = typeof id === "number" ? id : parseInt(id, 10) || 0;
  return PALETTES[Math.abs(n) % PALETTES.length];
}
function coverBg(p){
  return `repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 3px,transparent 3px 6px),`
    +`repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 3px,transparent 3px 6px),`
    +`linear-gradient(180deg,${p.sky} 0%,${p.sky} 54%,${p.ground} 54%,${p.ground} 100%)`;
}
function shotBg(p,i){
  const split=[44,62,72][i%3];
  const a=i%2?p.ground:p.sky, b=i%2?p.sky:p.ground;
  return `repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 3px,transparent 3px 6px),`
    +`linear-gradient(180deg,${a} 0%,${a} ${split}%,${b} ${split}%,${b} 100%)`;
}

/* =========================================================
   CAMBIO 2 — hook que cuenta cuántas tarjetas entran en 1 fila
   ========================================================= */
function useFitCount(ref, cardWidth=166){
  const [cols, setCols] = useState(6);
  useEffect(()=>{
    if(!ref.current) return;
    const ro = new ResizeObserver(([e])=>{
      setCols(Math.max(1, Math.floor(e.contentRect.width / cardWidth)));
    });
    ro.observe(ref.current);
    return ()=>ro.disconnect();
  }, [ref, cardWidth]);
  return cols;
}

/* =========================================================
   TOP BAR — con navegación Biblioteca / Emulador
   ========================================================= */
function TopBar({query, setQuery, screen, setScreen, onHome, onSearch}){
  const auth = window.GB_AUTH;
  const submit = (e)=>{ e.preventDefault(); onSearch(query); };
  const onLib  = ()=>{ onHome(); setScreen("lib"); };
  const onEmuLib = ()=>{ onHome(); setScreen("emu-lib"); };

/* =========================================================

function Card({g, onOpen, fav, toggleFav}){

/* =========================================================
   CHIP BAR
   ========================================================= */
function ChipBar({filter, setFilter, platforms}){
  const top = ['NES','SNES','GB','GBA','GEN','N64','PS','PS2','DS'];
  const shown = top.filter(p=>platforms.includes(p));
  return (
    <div className="chipbar">
      <button className={"chip"+(filter==="all"?" on":"")} onClick={()=>setFilter("all")}>Todas</button>
      {shown.map(p=>(
        <button key={p} className={"chip"+(filter===p?" on":"")} onClick={()=>setFilter(p)}>{p}</button>
      ))}
    </div>
  );
}

/* =========================================================
   CAMBIO 2 — SHELF: una fila, sin scroll horizontal, con "ver todo"
   ========================================================= */
function Shelf({shelf, onOpen, favs, toggleFav, onSeeAll}){
  const ref = useRef(null);
  const cols = useFitCount(ref);
  const visible = shelf.games.slice(0, cols);
  const total = shelf.total || shelf.games.length;

  return (
    <div className="shelf">
      <div className="shelf-head">
        <h3>{shelf.label} <span className="badge">{total}</span></h3>
        {total > visible.length && (
          <a href="#" onClick={e=>{e.preventDefault(); onSeeAll(shelf);}}>
            ver todo ({total}) ›
          </a>
        )}
      </div>
      <div ref={ref} className="shelf-grid">
        {visible.map(g=>(
          <Card key={g.id} g={g} onOpen={onOpen} fav={!!favs[g.id]} toggleFav={toggleFav}/>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
   CAMBIO 2 — CATALOG: grilla completa de una plataforma (scroll vertical)
   ========================================================= */
function Catalog({shelf, onOpen, onBack, favs, toggleFav}){
  const [games,   setGames]   = useState([]);
  const [page,    setPage]    = useState(0);
  const [total,   setTotal]   = useState(0);
  const [loading, setLoading] = useState(false);

  const fetchPage = useCallback((p) => {
    setLoading(true);
    fetch("/api/juegos/?platform=" + encodeURIComponent(shelf.platform) + "&page=" + p)
      .then(r => r.json())
      .then(d => {
        setGames(prev => p === 1 ? (d.games || []) : prev.concat(d.games || []));
        setTotal(d.total || 0);
        setPage(p);
        setLoading(false);
      })
      .catch(() => setLoading(false));
  }, [shelf.platform]);

  useEffect(() => { fetchPage(1); }, [fetchPage]);

  return (
    <>
      <div className="subbar">
        <button className="backbtn" onClick={onBack}>‹ Biblioteca</button>
        <span className="crumb">{shelf.label}</span>
      </div>
      <div className="scroll screen-anim">
        {loading && games.length === 0 && <div className="loading">CARGANDO</div>}
        <div className="catalog-grid">
          {games.map(g=>(
            <Card key={g.id} g={g} onOpen={onOpen} fav={!!favs[g.id]} toggleFav={toggleFav}/>
          ))}
        </div>
        {games.length < total && (
          <div style={{textAlign:"center",padding:"0 22px 30px"}}>
            <button className="chip" onClick={()=>fetchPage(page+1)} disabled={loading}>
              {loading ? "Cargando…" : "Cargar más (" + (total - games.length) + " restantes)"}
            </button>
          </div>
        )}
        <div style={{height:30}}/>
      </div>
    </>
  );
}

/* =========================================================
   LIBRARY — estanterías principales
   ========================================================= */
function Library({shelves, platforms, filter, setFilter, onOpen, favs, toggleFav,
                  loading, searchResults, searchTotal, onLoadMore, isSearching, onSeeAll}){
  if(loading) return <div className="loading">CARGANDO</div>;

  if(searchResults !== null){
    return (
      <div className="scroll screen-anim">
        <ChipBar filter={filter} setFilter={setFilter} platforms={platforms}/>
        <div className="shelf">
          <div className="shelf-head">
            <h3>Resultados <span className="badge">{searchTotal}</span></h3>
          </div>
          <div className="catalog-grid">
            {searchResults.map(g=>(
              <Card key={g.id} g={g} onOpen={onOpen} fav={!!favs[g.id]} toggleFav={toggleFav}/>
            ))}
            {searchResults.length===0 && (
              <p style={{color:"var(--muted)",fontSize:20,gridColumn:"1/-1"}}>Sin resultados.</p>
            )}
          </div>
          {searchResults.length < searchTotal && (
            <div style={{textAlign:"center",padding:"0 22px 30px"}}>
              <button className="chip" onClick={onLoadMore} disabled={isSearching}>
                {isSearching ? "Cargando…" : "Cargar más"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  const visibleShelves = filter==="all" ? shelves : shelves.filter(s=>s.platform===filter);
  return (
    <div className="scroll screen-anim">
      <ChipBar filter={filter} setFilter={setFilter} platforms={platforms}/>
      {visibleShelves.map(shelf=>(
        <Shelf key={shelf.platform} shelf={shelf}
          onOpen={onOpen} favs={favs} toggleFav={toggleFav}
          onSeeAll={onSeeAll}/>
      ))}
      <div style={{height:30}}/>
    </div>
  );
}

/* =========================================================
   SECCIÓN EMULADOR — muestra disponibilidad real de cada ROM
   ========================================================= */
function useRomStatus(rom){
  const [status, setStatus] = useState(rom ? "checking" : "demo");
  useEffect(()=>{
    if(!rom){ setStatus("demo"); return; }
    fetch(rom, {method:"HEAD"})
      .then(r=>setStatus(r.ok ? "ready" : "missing"))
      .catch(()=>setStatus("missing"));
  },[rom]);
  return status;
}

function EmuCard({g, onPlay}){
  const pal    = PALETTES[g.pal_idx];
  const status = useRomStatus(g.rom);

  const badge = {
    demo:     {label:"▶ JUGAR",   color:"var(--green)"},
    ready:    {label:"▶ JUGAR",   color:"var(--green)"},
    checking: {label:"…",         color:"var(--green-d)"},
    missing:  {label:"ROM FALTA", color:"#d8623c"},
  }[status];

  return (
    <button className="emu-card"
      onClick={()=> status !== "missing" && onPlay(g)}
      style={{opacity: status==="missing" ? .55 : 1,
              cursor:  status==="missing" ? "default" : "pointer"}}>
      <div className="emu-cover"
        style={{background: g.image_url ? undefined : coverBg(pal)}}>
        {g.image_url && <img src={g.image_url} alt={g.name}/>}
        <div className="emu-badge">
          <span style={{background: badge.color, fontSize: badge.label.length>2?"11px":"20px"}}>
            {badge.label}
          </span>
        </div>
        {/* etiqueta DEMO */}
        {g.core === null && (
          <span style={{position:"absolute",top:6,left:6,
            fontFamily:"var(--pixel-font)",fontSize:8,
            background:"var(--green-d)",color:"var(--green-2)",
            padding:"2px 6px",zIndex:3}}>DEMO</span>
        )}
      </div>
      <div className="emu-info">
        <div className="emu-title">{g.name}</div>
        <div className="emu-con">{g.platform}</div>
        {status==="missing" && (
          <div style={{fontFamily:"var(--pixel-font)",fontSize:8,
            color:"#d8623c",marginTop:4}}>
            Agregá {g.rom?.split("/").pop()}
          </div>
        )}
      </div>
    </button>
  );
}

function EmuLibrary({onPlay}){
  return (
    <div className="emu-library screen-anim">
      <h2>EMULADOR</h2>
      <p>Juegos con emulación disponible. Los marcados en rojo necesitan su archivo ROM.</p>
      <div className="emu-cards">

/* =========================================================
   REAL EMULATOR — EmulatorJS para ROMs externas
   ========================================================= */
function RealEmulator({g, onExit}){
  const [romOk, setRomOk] = useState(null); // null=checking true=ok false=missing

  // Verifica que la ROM exista antes de cargar EmulatorJS
  useEffect(()=>{
    fetch(g.rom, {method:"HEAD"})
      .then(r=>setRomOk(r.ok))
      .catch(()=>setRomOk(false));
  },[g.rom]);

  // Inyecta EmulatorJS cuando la ROM está confirmada
  useEffect(()=>{
    if(romOk !== true) return;

    window.EJS_player         = "#ejs-container";
    window.EJS_core           = g.core;
    window.EJS_gameUrl        = g.rom;
    window.EJS_pathtodata     = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded  = true;
    window.EJS_color          = "#9bbc0f";   // DMG green
    window.EJS_backgroundColor= "#0c0f0b";
    window.EJS_defaultOptions = {
      "save-state-slot": 1,
      "save-state-location": "keep in browser",
    };

    const script = document.createElement("script");
    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    script.id  = "ejs-loader";
    document.body.appendChild(script);

    return ()=>{
      try{
        if(window.EJS_emulator){
          if(window.EJS_emulator.pause) window.EJS_emulator.pause();
          if(window.EJS_emulator.module){
            var mod = window.EJS_emulator.module;
            if(mod._emscripten_cancel_main_loop) mod._emscripten_cancel_main_loop();
            var ac = (mod.SDL2 && mod.SDL2.audioContext) || window.EJS_emulator.audioContext;
            if(ac && ac.state !== "closed") ac.close();
          }
        }
      }catch(e){}
      var cont = document.getElementById("ejs-container");
      if(cont) cont.innerHTML = "";
      var ejsScripts = document.querySelectorAll('script[src*="emulatorjs"]');
      for(var i=0;i<ejsScripts.length;i++){ ejsScripts[i].remove(); }
      var ejsKeys = ["EJS_emulator","EJS_player","EJS_core","EJS_gameUrl","EJS_pathtodata",
        "EJS_startOnLoaded","EJS_color","EJS_backgroundColor","EJS_defaultOptions"];
      for(var j=0;j<ejsKeys.length;j++){ delete window[ejsKeys[j]]; }
    };
  },[romOk, g.rom, g.core]);

  // Cerrar con Escape
  useEffect(()=>{
    const h=(e)=>{ if(e.key==="Escape") onExit(); };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[onExit]);

  return (
    <div className="emu-wrap">
      <div className="emu-top">
        <button className="backbtn" onClick={onExit}>‹ Salir</button>
        <span className="now">Jugando <b>{g.name}</b> · {g.platform}</span>
        <span className="live"><i></i>EN VIVO</span>
      </div>

      {romOk === null && (
        <div className="loading">CARGANDO ROM…</div>
      )}

      {romOk === false && (
        <div style={{flex:1,display:"grid",placeItems:"center",padding:40,textAlign:"center"}}>
          <div>
            <div style={{fontFamily:"var(--pixel-font)",fontSize:14,
              color:"#d8623c",marginBottom:20}}>ROM NO ENCONTRADA</div>
            <p style={{color:"var(--muted)",fontSize:20,maxWidth:"40ch",
              margin:"0 auto 28px",lineHeight:1.4}}>
              Copiá{" "}
              <span style={{color:"var(--green)",fontFamily:"var(--ui-font)"}}>
                {g.rom.split("/").pop()}
              </span>{" "}
              a <span style={{color:"var(--green)"}}>static/roms/</span> y recargá.
            </p>
            <button className="backbtn" onClick={onExit}>‹ Volver</button>
          </div>
        </div>
      )}

      {romOk === true && (
        <div style={{flex:1,minHeight:0,position:"relative",background:"#0c0f0b",overflow:"hidden"}}>
          <div id="ejs-container" style={{
            position:"absolute",inset:0,width:"100%",height:"100%"
          }}/>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   FICHA — datos enriquecidos desde IGDB
   ========================================================= */
function Detail({g, onBack, fav, toggleFav}){
  const pal  = palette(g.id);
  const mono = (g.name||'??').slice(0,2).toUpperCase();

  const [igdb,       setIgdb]       = useState(null);
  const [loading,    setLoading]    = useState(true);
  const [lightbox,   setLightbox]   = useState(null);   // URL de imagen ampliada
  const [ytOpen,     setYtOpen]     = useState(false);  // mostrar embed YouTube

  useEffect(()=>{
    setIgdb(null); setLoading(true);
    fetch(`/api/igdb-ficha/?game_id=${g.id}`)
      .then(r=>r.ok ? r.json() : null)
      .then(d=>{ setIgdb(d); setLoading(false); })
      .catch(()=>setLoading(false));
  }, [g.id]);

  // cerrar lightbox con Esc
  useEffect(()=>{
    if(!lightbox) return;
    const h=(e)=>{ if(e.key==='Escape') setLightbox(null); };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[lightbox]);

  const coverSrc   = igdb?.cover_url  || g.image_url || null;
  const shots      = igdb?.screenshots || [];
  const chars      = igdb?.characters  || [];
  const similar    = igdb?.similar_games|| [];
  const videos     = igdb?.videos      || [];
  const altNames   = igdb?.alt_names   || [];
  const ageRatings = igdb?.age_ratings || [];
  const firstVideo = videos[0];

  const year   = igdb?.year  || g.year;
  const genre  = igdb?.genre || g.genre;

  return (
    <>
      {/* lightbox */}
      {lightbox && (
        <div className="lightbox" onClick={()=>setLightbox(null)}>
          <img src={lightbox} alt="screenshot" onClick={e=>e.stopPropagation()}/>
          <button className="lightbox-close" onClick={()=>setLightbox(null)}>✕ CERRAR</button>
        </div>
      )}

      <div className="subbar">
        <button className="backbtn" onClick={onBack}>‹ Biblioteca</button>
        <span className="crumb">{g.platform} / {genre}</span>
      </div>

      <div className="scroll screen-anim">
        <div className="detail">
          <div className="detail-grid">

            {/* ── columna izquierda ── */}
            <div className="d-left">
              <div className="d-cover" style={{background: coverSrc ? undefined : coverBg(pal)}}>
                {coverSrc
                  ? <img src={coverSrc} alt={g.name}
                      style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>
                  : <span className="mono">{mono}</span>}
              </div>
              <button className={"btn-play"+(fav?" on":"")} onClick={()=>toggleFav(g.id)}>
                {fav ? "★ EN MI LISTA" : "＋ GUARDAR"}
              </button>
            </div>

            {/* ── columna derecha ── */}
            <div>
              <h1 className="d-title">{igdb?.name || g.name}</h1>

              <div className="metarow">
                <span className="meta-chip"><b>{g.platform}</b></span>
                {year  && <span className="meta-chip">{year}</span>}
                {genre && <span className="meta-chip">{genre}</span>}
                {igdb?.game_modes?.map(m=>(
                  <span key={m} className="meta-chip">{m}</span>
                ))}
                {ageRatings.map((ar,i)=>(
                  <span key={i} className="age-chip">
                    <span className="org">{ar.org}</span>{ar.label}
                  </span>
                ))}
              </div>

              {/* ratings */}
              {(igdb?.critic_rating || igdb?.rating) && (
                <div className="ratings">
                  {igdb.critic_rating && (
                    <div className="rate">
                      <span className="num">{igdb.critic_rating}</span>
                      <span className="lab">Crítica
                        <b>{igdb.critic_rating_count ? `${igdb.critic_rating_count} reseñas` : ''}</b>
                      </span>
                    </div>
                  )}
                  {igdb.rating && (
                    <div className="rate">
                      <span className="num">{igdb.rating}</span>
                      <span className="lab">Usuarios
                        <b>{igdb.rating_count ? `${igdb.rating_count} reseñas` : ''}</b>
                      </span>
                    </div>
                  )}
                </div>
              )}

              {/* descripción */}
              {loading && <p className="d-summary" style={{color:"var(--muted-2)"}}>Cargando…</p>}
              {!loading && igdb?.summary && <p className="d-summary">{igdb.summary}</p>}

              {/* personajes */}
              {chars.length > 0 && (
                <>
                  <div className="sec-h">PERSONAJES</div>
                  <div className="chars">
                    {chars.map((c,i)=>(
                      <div className="char" key={i}>
                        <div className="mug">
                          {c.mug_url
                            ? <img src={c.mug_url} alt={c.name} loading="lazy"/>
                            : <span className="mono">{(c.name||'?').slice(0,2).toUpperCase()}</span>}
                        </div>
                        <div className="cn">{c.name}</div>
                      </div>
                    ))}
                  </div>
                </>

              {/* galería de capturas */}
              {shots.length > 0 && (
                <>
                  <div className="sec-h">CAPTURAS</div>
                  <div className="gallery">
                    <div className="shot-main" onClick={()=>setLightbox(shots[0])}>
                      <img src={shots[0]} alt="screenshot 1" loading="lazy"/>
                    </div>
                    <div className="shot-strip">
                      {shots[1] && (
                        <div className="shot-sm" onClick={()=>setLightbox(shots[1])}>
                          <img src={shots[1]} alt="screenshot 2" loading="lazy"/>
                        </div>

                      {shots.length > 2
                        ? <div className="shot-more" onClick={()=>setLightbox(shots[2])}>
                            {shots.length > 3 ? `+${shots.length-2} capturas` : shots[2] ? '▶ ver más' : ''}
                          </div>

                          <div className="shot-sm" onClick={()=>setLightbox(shots[2])}>
                            <img src={shots[2]} alt="screenshot 3" loading="lazy"/>
                          </div>
                        )}
                    </div>
                  </div>

                <>
                  <div className="sec-h">CAPTURAS</div>

                    {[0,1,2].map(i=>(
                      <div className="shot" key={i} style={{background:shotBg(pal,i)}}>

                          fontFamily:"var(--pixel-font)",fontSize:8,

                        allow="autoplay; fullscreen" allowFullScreen/>
                    : <div className="trailer" onClick={()=>setYtOpen(true)}>
                        <span className="pl">▶</span>
                        <span className="tx">{firstVideo.name || 'Trailer oficial'}
                          <b>youtube.com · click para reproducir</b>
                        </span>
                      </div>}
                </>

              {/* ficha técnica */}
              <div className="sec-h">FICHA TÉCNICA</div>
              <div className="specs">
                {(igdb?.developer||g.publisher) && (
                  <div className="spec"><span>Desarrolladora</span>
                    <b>{igdb?.developer||g.publisher}</b></div>
                )}
                {(igdb?.publisher) && (
                  <div className="spec"><span>Editora</span><b>{igdb.publisher}</b></div>
                )}
                {year && (
                  <div className="spec"><span>Lanzamiento</span><b>{year}</b></div>
                )}
                {igdb?.engines?.length > 0 && (
                  <div className="spec"><span>Motor</span><b>{igdb.engines.join(', ')}</b></div>

                {igdb?.franchises?.length > 0 && (
                  <div className="spec"><span>Saga</span><b>{igdb.franchises.join(', ')}</b></div>

              {/* también conocido como */}

                <>
                  <div className="sec-h">TAMBIÉN CONOCIDO COMO</div>
                  <div className="taglist">
                    {altNames.map((an,i)=>(
                      <span key={i} className="t" title={an.comment||''}>
                        {an.name}
                      </span>
                    ))}
                  </div>
                </>

              {/* juegos similares */}
              {similar.length > 0 && (
                <>
                  <div className="sec-h">JUEGOS SIMILARES</div>
                  <div className="sim">
                    {similar.map((sg,i)=>{
                      const sm = (sg.name||'??').slice(0,2).toUpperCase();
                      return (
                        <div className="tile" key={i}>
                          <div className="art"
                            style={{background: sg.cover_url ? undefined : coverBg(palette(i))}}>
                            {sg.cover_url
                              ? <img src={sg.cover_url} alt={sg.name} loading="lazy"/>
                              : <span className="mono">{sm}</span>}
                          </div>
                          <div className="st">{sg.name}</div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              <div style={{height:40}}/>
            </div>
          </div>
        </div>

        <div className="mobile-playbar">
          <button className={"btn-play"+(fav?" on":"")} onClick={()=>toggleFav(g.id)}>
            {fav ? "★ EN MI LISTA" : "＋ GUARDAR"}
          </button>
        </div>
      </div>
    </>
  );
}

/* =========================================================
   EMULADOR — demo jugable (solo desde sección Emulador)
   ========================================================= */
function fmt(s){const m=Math.floor(s/60),x=s%60;return(m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function spawnCoin(){return{id:Math.random(),x:10+Math.random()*78,y:14+Math.random()*64};}

function Emulator({g, onExit}){
  const pal = PALETTES[g.pal_idx ?? 0];
  const [pos,setPos]    = useState({x:50,y:55});
  const [coins,setCoins]= useState(()=>[spawnCoin(),spawnCoin(),spawnCoin()]);
  const [score,setScore]= useState(0);
  const [time,setTime]  = useState(0);
  const [saves,setSaves]= useState([]);
  const [pressed,setPressed] = useState(new Set());
  const [flash,setFlash]= useState("");
  const [aPulse,setAPulse]=useState(false);
  const held=useRef(new Set());
  const consoleRef=useRef(null);

  const hold=useCallback((n,on)=>{
    if(on)held.current.add(n);else held.current.delete(n);
    setPressed(p=>{const s=new Set(p);on?s.add(n):s.delete(n);return s;});
  },[]);
  const doA=useCallback(()=>{setAPulse(true);setTimeout(()=>setAPulse(false),180);},[]);

  useEffect(()=>{
    let raf,last=performance.now();
    const loop=(t)=>{
      const dt=Math.min(50,t-last)/16.7;last=t;
      setPos(p=>{
        let{x,y}=p;const s=1.5*dt;
        if(held.current.has("left"))x-=s; if(held.current.has("right"))x+=s;
        if(held.current.has("up"))y-=s;   if(held.current.has("down"))y+=s;
        return{x:Math.max(4,Math.min(92,x)),y:Math.max(8,Math.min(80,y))};
      });
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf);
  },[]);

  useEffect(()=>{
    setCoins(cs=>{
      let hit=0;
      const left=cs.filter(c=>{
        const d=Math.hypot(c.x-pos.x,c.y-pos.y);
        if(d<7){hit++;return false;}return true;
      });
      if(hit){setScore(s=>s+hit*10);return left.concat(Array.from({length:hit},spawnCoin));}
      return cs;
    });
  },[pos]);

  useEffect(()=>{const id=setInterval(()=>setTime(t=>t+1),1000);return()=>clearInterval(id);},[]);

  useEffect(()=>{
    const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",
               a:"left",d:"right",w:"up",s:"down"};
    const dn=(e)=>{
      const k=e.key.length===1?e.key.toLowerCase():e.key;
      if(map[k]){e.preventDefault();hold(map[k],true);}
      else if(k==="x"){hold("A",true);doA();}
      else if(k==="z"){hold("B",true);}
      else if(k==="Escape")onExit();
    };
    const up=(e)=>{
      const k=e.key.length===1?e.key.toLowerCase():e.key;
      if(map[k])hold(map[k],false);
      else if(k==="x")hold("A",false);
      else if(k==="z")hold("B",false);
    };
    window.addEventListener("keydown",dn);window.addEventListener("keyup",up);
    return()=>{window.removeEventListener("keydown",dn);window.removeEventListener("keyup",up);};
  },[hold,doA,onExit]);

  const save=()=>{
    setSaves(s=>[{id:Date.now(),t:fmt(time),score,x:pos.x,y:pos.y},...s].slice(0,6));
    setFlash("save"); setTimeout(()=>setFlash(""),520);
  };
  const loadSave=(s)=>{setPos({x:s.x,y:s.y});setScore(s.score);};
  const fullscreen=()=>{const el=consoleRef.current;if(el?.requestFullscreen)el.requestFullscreen();};
  const P=(n)=>pressed.has(n)?" press":"";

  return (
    <div className="emu-wrap">
      <div className="emu-top">
        <button className="backbtn" onClick={onExit}>‹ Salir</button>
        <span className="now">Jugando <b>{g.name}</b> · {g.platform}</span>
        <span className="live"><i></i>EN VIVO</span>
        <span style={{marginLeft:"auto",fontSize:17,color:"var(--muted)"}}>★ {score} · {fmt(time)}</span>
      </div>

      <div className="emu-stage">
        <div className="console" ref={consoleRef}>
          <div className="scr-frame">
            <div className="gbscreen" style={{backgroundColor:pal.ground}}>
              <span className="hud">{g.name.slice(0,2).toUpperCase()} ×{score/10}</span>
              <span className="hud2">{fmt(time)}</span>
              {coins.map(c=><span key={c.id} className="coin" style={{left:c.x+"%",top:c.y+"%"}}/>)}
              <div className="sprite" style={{left:pos.x+"%",top:pos.y+"%",
                transform:aPulse?"scale(1.35)":"scale(1)"}}/>
              <div className="ground"/>
            </div>
          </div>
          <div className="brand-plate">
            <span className="gb">GAME<b>BASE</b></span>
            <span className="pwr"><i></i>POWER</span>
          </div>
          <div className="controls">
            <div className="dpad">
              <button className="blank"/>
              <button className={P("up")}
                onPointerDown={()=>hold("up",true)} onPointerUp={()=>hold("up",false)}
                onPointerLeave={()=>hold("up",false)}>▲</button>
              <button className="blank"/>
              <button className={P("left")}
                onPointerDown={()=>hold("left",true)} onPointerUp={()=>hold("left",false)}
                onPointerLeave={()=>hold("left",false)}>◀</button>
              <button className="ctr"/>
              <button className={P("right")}
                onPointerDown={()=>hold("right",true)} onPointerUp={()=>hold("right",false)}
                onPointerLeave={()=>hold("right",false)}>▶</button>
              <button className="blank"/>
              <button className={P("down")}
                onPointerDown={()=>hold("down",true)} onPointerUp={()=>hold("down",false)}
                onPointerLeave={()=>hold("down",false)}>▼</button>
              <button className="blank"/>
            </div>
            <div className="startsel">
              <button className="pill">SELECT</button>
              <button className="pill">START</button>
            </div>
            <div className="ab">
              <button className={P("B")}
                onPointerDown={()=>hold("B",true)} onPointerUp={()=>hold("B",false)}
                onPointerLeave={()=>hold("B",false)}>B</button>
              <button className={aPulse?"press":""}
                onPointerDown={()=>{hold("A",true);doA();}} onPointerUp={()=>hold("A",false)}
                onPointerLeave={()=>hold("A",false)}>A</button>
            </div>
          </div>
        </div>
      </div>

      <div className="toolbar">
        <button className={"tool"+(flash==="save"?" flash":"")} onClick={save}>▤ Guardar estado</button>
        <button className="tool" onClick={()=>saves[0]&&loadSave(saves[0])}>▣ Cargar último</button>
        <button className="tool" onClick={fullscreen}>⛶ Pantalla completa</button>
        <button className="tool" onClick={onExit}>✕ Cerrar juego</button>
      </div>

      <div className="tray">
        <h4>ESTADOS GUARDADOS</h4>
        <div className="tray-grid">
          {saves.length===0 && (
            <div className="ss-empty">Aún no hay estados. Pulsa "Guardar estado" para crear uno.</div>
          )}
          {saves.map(s=>(
            <button className="ss" key={s.id} onClick={()=>loadSave(s)}
              style={{cursor:"pointer",textAlign:"left",padding:0}}>
              <div className="th" style={{backgroundColor:pal.ground}}>
                <span className="coin" style={{left:"40%",top:"40%",animation:"none"}}/>
              </div>
              <div className="cap"><span>{s.t}</span><b>★{s.score}</b></div>
            </button>
          ))}
        </div>
      </div>
      <div className="kbd-hint">
        Controles: <kbd>← ↑ → ↓</kbd> o <kbd>WASD</kbd> mover · <kbd>X</kbd> botón A ·
        <kbd>Z</kbd> botón B · recogé las monedas · <kbd>Esc</kbd> salir
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App(){
  // screen: "lib" | "emu-lib" | "ficha" | "emu" | "catalogo"
  const [screen,  setScreen]  = useState("lib");
  const [game,    setGame]    = useState(null);
  const [catalog, setCatalog] = useState(null); // shelf para "ver todo"
  const [query,   setQuery]   = useState("");
  const [filter,  setFilter]  = useState("all");
  const [favs, setFavs] = useState(()=>{
    try{return JSON.parse(localStorage.getItem("gb_favs")||"{}");}catch(e){return{};}
  });

  const [shelves,   setShelves]   = useState([]);
  const [platforms, setPlatforms] = useState([]);
  const [loading,   setLoading]   = useState(true);

  const [searchResults, setSearchResults] = useState(null);
  const [searchTotal,   setSearchTotal]   = useState(0);
  const [searchPage,    setSearchPage]    = useState(1);
  const [isSearching,   setIsSearching]   = useState(false);
  const searchQRef = useRef("");

  useEffect(()=>{
    try{localStorage.setItem("gb_favs",JSON.stringify(favs));}catch(e){}
  },[favs]);

  useEffect(()=>{
    fetch("/api/juegos/")
      .then(r=>r.json())
      .then(d=>{ setShelves(d.shelves||[]); setPlatforms(d.platforms||[]); setLoading(false); })
      .catch(()=>setLoading(false));
  },[]);

  const toggleFav = (id)=>setFavs(f=>{const n={...f};n[id]?delete n[id]:n[id]=1;return n;});
  const openGame  = (g)=>{ setGame(g); setScreen("ficha"); };
  const play      = (g)=>{ setGame(g); setScreen("emu"); };

  const home = ()=>{
    setQuery(""); setSearchResults(null); setSearchPage(1); setCatalog(null);
  };

  const doSearch = (q, plat, page=1, append=false)=>{
    if(!q && (plat==="all"||!plat)){ setSearchResults(null); return; }
    setIsSearching(true);
    searchQRef.current = q;
    const p = new URLSearchParams();
    if(q) p.set("q",q);
    if(plat && plat!=="all") p.set("platform",plat);
    p.set("page", page);
    fetch("/api/juegos/?"+p)
      .then(r=>r.json())
      .then(d=>{
        if(searchQRef.current!==q) return;
        setSearchResults(prev=>append?(prev||[]).concat(d.games):d.games);
        setSearchTotal(d.total);
        setSearchPage(page);
        setIsSearching(false);
      })
      .catch(()=>setIsSearching(false));
  };

  useEffect(()=>{
    if(query) doSearch(query, filter, 1, false);
    else setSearchResults(null);
  },[filter]);

  useEffect(()=>{
    const h=(e)=>{
      if(e.key==="/" && (screen==="lib"||screen==="catalogo")
         && document.activeElement.tagName!=="INPUT"){
        e.preventDefault();
        document.querySelector(".search input")?.focus();
      }
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[screen]);

  const showTopBar = screen !== "emu";

  return (
    <div className="app">
      {showTopBar && (
        <TopBar query={query} setQuery={setQuery}
          screen={screen} setScreen={setScreen}
          onHome={()=>{ home(); setScreen(s=>s==="emu-lib"?"emu-lib":"lib"); }}
          onSearch={(q)=>doSearch(q,filter,1,false)}/>
      )}

      {screen==="lib" && (
        <Library
          shelves={shelves} platforms={platforms}
          filter={filter} setFilter={p=>{
            setFilter(p);
            if(p !== "all"){
              const shelf = shelves.find(s=>s.platform===p) || {platform:p, label:p};
              setCatalog(shelf);
              setScreen("catalogo");
            }
          }}
          onOpen={openGame} favs={favs} toggleFav={toggleFav}
          loading={loading}
          searchResults={searchResults} searchTotal={searchTotal}
          isSearching={isSearching}
          onLoadMore={()=>doSearch(query,filter,searchPage+1,true)}
          onSeeAll={shelf=>{ setCatalog(shelf); setScreen("catalogo"); }}
        />
      )}

      {screen==="catalogo" && catalog && (
        <Catalog shelf={catalog} onOpen={openGame} favs={favs} toggleFav={toggleFav}
          onBack={()=>{ setFilter("all"); setScreen("lib"); }}/>
      )}

      {/* CAMBIO 1 — sección emulador separada */}
      {screen==="emu-lib" && (
        <EmuLibrary onPlay={play}/>
      )}

      {screen==="ficha" && game && (
        <Detail g={game} onBack={()=>setScreen(s=>"lib")}
          fav={!!favs[game.id]} toggleFav={toggleFav}/>
      )}

      {screen==="emu" && game && (
        game.core
          ? <RealEmulator key={game.id} g={game} onExit={()=>setScreen("emu-lib")}/>
          : <Emulator     key={game.id} g={game} onExit={()=>setScreen("emu-lib")}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("gb-root")).render(<App/>);

<button class="chat-fab" id="chatFab" aria-label="Abrir asistente">
  <span class="dot"></span>

</button>

<section class="chat-panel" id="chatPanel" aria-hidden="true">
  <div class="chat-head">
    <svg class="ci" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2.4"/>
      <rect x="7" y="9" width="2.4" height="2.4" fill="currentColor"/>
      <rect x="11" y="9" width="2.4" height="2.4" fill="currentColor"/>
      <rect x="15" y="9" width="2.4" height="2.4" fill="currentColor"/>
    </svg>
    <div>
      <div class="ht">CHAT <b>GAMEBASE</b></div>
      <div class="st">Asistente de juegos IA</div>
    </div>
    <button class="chat-x" id="chatClose" aria-label="Cerrar">✕</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <form class="chat-foot" id="chatForm">
    <input id="chatInput" type="text" placeholder="Escribí un mensaje…" autocomplete="off" maxlength="240">
    <button class="chat-send" type="submit">ENVIAR</button>
  </form>
</section>

<script>
(function(){
  var fab     = document.getElementById('chatFab');
  var panel   = document.getElementById('chatPanel');
  var body    = document.getElementById('chatBody');
  var form    = document.getElementById('chatForm');
  var input   = document.getElementById('chatInput');
  var seeded  = false;
  var csrf    = '{{ csrf_token }}';

  function addMsg(text, who, id){
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    if(id) d.id = id;
    body.appendChild(d);
    body.scrollTop = body.scrollHeight;
    return d;
  }

  function openChat(){
    panel.classList.add('open');
    panel.setAttribute('aria-hidden','false');
    fab.querySelector('.dot').style.display = 'none';
    if(!seeded){
      addMsg('¡Hola! Spawnée para ayudarte. Preguntame sobre cualquier juego, consola o época del catálogo.','bot');
      seeded = true;
    }
    setTimeout(function(){ input.focus(); }, 120);
  }
  function closeChat(){
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
  }

  fab.addEventListener('click', function(){
    panel.classList.contains('open') ? closeChat() : openChat();
  });
  document.getElementById('chatClose').addEventListener('click', closeChat);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var msg = input.value.trim();
    if(!msg) return;
    addMsg(msg, 'me');
    input.value = '';

    var typingId = 'typing-' + Date.now();
    addMsg('escribiendo…', 'typing', typingId);

    fetch('/api/chat/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrf
      },
      body: JSON.stringify({ message: msg })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var t = document.getElementById(typingId);
      if(t) t.remove();
      addMsg(data.reply || 'Sin respuesta.', 'bot');
    })
    .catch(function(){
      var t = document.getElementById(typingId);
      if(t) t.remove();
      addMsg('Error de conexión con la IA.', 'bot');
    });
  });
})();
</script>
